name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # The gate prepublishOnly runs, plus test:tools — so a green build here
      # means the package is publishable. Never append `|| true`: a step that
      # cannot fail reports success on a broken tree, which is worse than no CI.
      - name: Run tests
        run: |
          npm run test:unit
          npm run test:node
          npm run test:field-validation
          npm run test:views
          npm run test:tools
        env:
          CI: true

      - name: Lint package and docs
        run: |
          npm run lint:package
          npm run lint:docs
